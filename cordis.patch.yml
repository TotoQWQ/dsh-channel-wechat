# 微信 ClawBot（iLink）通道：把微信聊天和 DSH 会话双向接起来。
# 安装后会注册 channel-wechat 这一行；改这里即可调整默认参数。
- insert:
    - id: channel-wechat
      name: dsh-channel-wechat
      config:
        enabled: true
        # 白名单：填微信用户 id（形如 xxxx@im.wechat）；为空表示谁发都放行
        allowFrom: []
        # 微信侧自动会话跑在哪个目录（留空则用 DSH 默认工作目录）
        cwd: ''
        # 可选：指定 agent preset
        agentPreset: ''
        # 微信消息进来后，等 agent 回复的最长时间（毫秒）
        replyTimeoutMs: 180000
        # 单条微信文本上限（超过会拆成多条发送）
        maxReplyChars: 1800
        # 注入会话时给微信消息加的前缀；留空 = 不加
        messagePrefix: ''
        # 网页里发的消息转发到微信时的前缀
        webMessagePrefix: '[网页] '
        # 双向镜像开关
        mirrorUserMessages: true
        mirrorAssistantMessages: true
        # 镜像扫描间隔（毫秒）
        mirrorIntervalMs: 1200
        # 选项 / 审批也发到微信：DSH 里的 ask_user_question 选项与审批卡会同步到微信，
        # 直接回序号（或文字）即可作答，不用回电脑点
        relayOptions: true
        # 微信里等选项/审批回复的时长（毫秒）
        optionReplyTimeoutMs: 110000
        # 超时怎么办：skip = 直接跳过继续（选项卡标未作答、审批按拒绝）；
        # handoff = 交还电脑端弹卡（没人守在电脑旁时会一直等）
        optionTimeoutMode: skip
        # 进度提示：一轮跑得久时，每隔一段时间在微信里报一次「已经思考多久」
        # 关掉：进度心跳在发送受限时会引发重试风暴，把正常回复挤掉（2026-11-14 排查）
        progressHeartbeat: false
        progressIntervalMs: 120000
        # 会话正在跑时，微信消息直接插进当前对话（steer），不再排在这一轮后面等
        insertWhileBusy: true
        # 表情包库（/emotion）：25 个细分分类目录 + index.json（留空 = ~/.dsh/wechat-emotions）
        emotionDir: ''
        # 首次启动把旧 wechat-stickers 迁进 emotion 库（原目录保留）
        migrateLegacyStickers: true
        # 可爱化回复：off / subtle（约一半回复带一个）/ always（每条都带）
        cuteLevel: subtle
        # 可爱化回复用的 emoji / 颜文字池
        cutePool: ['🌊', '🐳', '✨', '😊', '🫧', '🎵', '🌸', '🐱', '🫶', '☕']
        # 自动表情：off 不发 / subtle 语境够强才发 / always 命中就发
        emotionAuto: subtle
        # subtle 档需要的语境分数（用户命中 2 分、助手命中 1 分）
        emotionThreshold: 2
        # 同一聊天自动发表情的冷却（毫秒）
        emotionCooldownMs: 300000
        # 是否允许外来来源表情包（插件内置等）；默认 false，只发用户自己收录的
        emotionAllowOtherSource: false
        # 思考片段摘要：边想边给微信发一句本地截取的短摘要（不调模型、不耗 token）
        # 同样关掉：每轮多次发送，容易触发微信侧限流
        thinkingSummary: false
        # 同一会话两条摘要的最小间隔（毫秒）
        thinkingSummaryIntervalMs: 30000
        # 单条摘要最多多少字
        thinkingSummaryChars: 120
        # 断联检测：长轮询多久没成功算断联（毫秒，最短 30000）
        healthStaleMs: 120000
        # 卡住时自动重启该账号的轮询
        healthCheck: true
        # 分段发送（微信不支持流式）：paragraph 先按空行分段再按长度切；length 为旧的纯长度切
        segmentMode: paragraph
        # 每条微信消息的字符上限（0 = 用 maxReplyChars）
        segmentMaxChars: 0
        # 相邻两条之间的间隔（毫秒）
        segmentDelayMs: 500
        # 多条时是否加「（1/3）」序号
        segmentIndex: false
        # 补发队列保留时长（毫秒），过期才丢（默认 6 小时）
        pendingTtlMs: 21600000
        # 连续发送失败多少次后暂缓发送（熔断）
        sendBreakerThreshold: 5
        # 熔断后暂缓时长（毫秒）
        sendBreakerMs: 300000
        # 流式分段：模型边生成边把「完整段落」发到微信（默认关，可在面板打开）
        streamSegment: false
        # 一个完整段落至少多少字才发（太短会刷屏）
        streamMinChars: 200
        # 两次流式发送的最小间隔（毫秒）
        streamMinIntervalMs: 1500
        # 建议入口：/suggest 提交 issue 到该仓库（owner/repo）
        suggestRepo: TotoQWQ/dsh-channel-wechat
        # GitHub token（留空读环境变量 GH_TOKEN / GITHUB_TOKEN；不会写日志）
        suggestToken: ''
        # issue 标签
        suggestLabels: ['suggestion', 'from-wechat']
        # 同一聊天提交建议的冷却（毫秒）
        suggestCooldownMs: 60000
        # GitHub API 地址（测试/企业版可改）
        githubApiBase: https://api.github.com
        # 风险消息邮件预警（只通知宿主，不拦截消息）；需要先配 SMTP 与收件人
        riskAlert: false
        # 风险规则（name/pattern）；留空用内置：赌博 / 诈骗刷单 / 色情 / 引流外链
        riskPatterns: []
        # 收件人 / 发件人
        riskEmailTo: ''
        riskEmailFrom: ''
        # 同一聊天预警冷却（毫秒）
        riskCooldownMs: 300000
        # SMTP（465 隐式 TLS；587 自动 STARTTLS）
        riskSmtpHost: ''
        riskSmtpPort: 465
        riskSmtpSecure: true
        riskSmtpUser: ''
        riskSmtpPass: ''
        # 自动化任务完成反馈：定时任务跑完给绑定的微信发一条完成通知
        automationReport: true
        # 判断「这一轮是定时任务触发」的时间窗口（毫秒）
        automationWindowMs: 120000
        # 热重载：/reload 或 POST /wechat-channel/reload 触发（不用重启 DSH）
        hotReload: true
        # 文件变更后自动热重载（默认关，避免编辑到一半就重载）
        autoHotReload: false
        # AI 输出文件转发：消息附件 + 文本里提到的本地文件都发到微信
        mirrorFiles: true
        # 超过这个大小的文件不转发（上限 50MB）
        mirrorFileMaxBytes: 52428800
        # 跨账号转发：同一会话下，A 号收到的消息也发到 B/C 号的微信
        relayAcrossAccounts: true
        relayPrefix: '[{account}] '
        # iLink 服务地址，一般不用改
        apiBase: 'https://ilinkai.weixin.qq.com'
